          window.__APP_STATE__ = {"page":{"body":{"sections":[{"data":{"release_trains":[{"title":"Dahlia","versions":[{"published":"2026-08-26","title":"2026-08-26.dahlia","isHistorical":false,"channel":"public","groups":[{"id":"payments","title":"Payments"},{"id":"billing","title":"Billing and invoicing"}],"entries":[{"id":"2026-08-10-adds-a-customer-update-deep-link-for-billing-portal-sessions","slug":"adds-a-customer-update-deep-link-for-billing-portal-sessions","products":["billing"],"breaking":false,"groupId":"billing","description":"Adds `customer_update` as a value for the [flow_data.type](/api/customer_portal/sessions/create?api-version=2026-08-26.dahlia#create_portal_session-flow_data-type) parameter when you [create a billing portal session](/api/customer_portal/sessions/create?api-version=2026-08-26.dahlia). Setting this value creates a deep link that navigates your customer directly to the billing information page in the customer portal, where they can update their details. This is consistent with existing deep-link flow types such as `payment_method_update`, `subscription_cancel`, and `subscription_update`.","impact":"You can now create billing portal sessions that link customers directly to the billing information update page by setting `flow_data.type` to `customer_update`. No changes are required for existing integrations.","release":"2026-08-26.dahlia","train":"dahlia","changed":["customer_update","customerUpdate","CustomerUpdate"],"affected":["BillingPortal.Session#create.flow_data.type","BillingPortal.Session.flow.type","BillingPortal.Session.flow","BillingPortal.SessionCreateParams.flow_data.type","billingportal.SessionCreateParams.flow_data.type","billingportal.Session.flow","BillingPortalSessionFlow","BillingPortalSessionFlow.Type","BillingPortal::Session::Flow","billing_portal.SessionCreateParamsFlowDatum.type","BillingPortal.Session.Flow.type","BillingPortal.Session.Flow"],"group":"Billing and invoicing","category":"api","title":["Adds a customer update deep link for billing portal sessions"]},{"id":"2026-08-10-adds-connect-parameters-to-the-payment-link-update-method","slug":"adds-connect-parameters-to-the-payment-link-update-method","products":["paymentlinks"],"breaking":false,"groupId":"payments","description":"Adds [application_fee_amount](/api/payment-link/update?api-version=2026-08-26.dahlia#update_payment_link-application_fee_amount), [application_fee_percent](/api/payment-link/update?api-version=2026-08-26.dahlia#update_payment_link-application_fee_percent), [on_behalf_of](/api/payment-link/update?api-version=2026-08-26.dahlia#update_payment_link-on_behalf_of), and [transfer_data](/api/payment-link/update?api-version=2026-08-26.dahlia#update_payment_link-transfer_data) as parameters on the [update a Payment Link](/api/payment-link/update?api-version=2026-08-26.dahlia) method. These parameters were previously available only on the [create a Payment Link](/api/payment-link/create?api-version=2026-08-26.dahlia) method. You can also pass an empty string to unset any of these parameters.  This updated money movement configuration applies to all Checkout Sessions created from the [Payment Link](/payment-links) after this change. Existing, active sessions aren't affected.","impact":"If you use [Connect](/connect) with Payment Links, you can modify application fees, destination charges, and on-behalf-of settings on an existing Payment Link without needing to create a separate one.","release":"2026-08-26.dahlia","train":"dahlia","changed":["application_fee_amount","application_fee_percent","on_behalf_of","transfer_data","applicationFeeAmount","applicationFeePercent","onBehalfOf","transferData","ApplicationFeeAmount","ApplicationFeePercent","OnBehalfOf","TransferData"],"affected":["PaymentLink#update","PaymentLinkUpdateParams","PaymentLinkParams","PaymentLink.update().$params","PaymentLinkModifyParams","PaymentLinkUpdateOptions"],"group":"Payments","category":"api","title":["Adds support for updating Connect parameters of an existing Payment Link"]},{"id":"2026-08-11-adds-funding-source-group-property-for-link-payments","slug":"adds-funding-source-group-property-for-link-payments","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds the [funding_source_group](/api/charges/object?api-version=2026-08-26.dahlia#charge_object-payment_method_details-link-funding_source_group) property to the [payment_method_details.link](/api/charges/object?api-version=2026-08-26.dahlia#charge_object-payment_method_details-link) hash of the [Charge](/api/charges/object?api-version=2026-08-26.dahlia) object. This property contains an identifier, prefixed with `lfsg_`, for the funding-source group selected for a [{% $link.brand_name %}](/payments/link) payment. It maps to the applicable pricing configuration in your Stripe pricing contract.","impact":"You can inspect the `payment_method_details.link.funding_source_group` of a Charge to identify the funding-source group associated with a {% $link.brand_name %} payment and reconcile it with the applicable pricing configuration in your Stripe pricing contract.","release":"2026-08-26.dahlia","train":"dahlia","changed":["funding_source_group","fundingSourceGroup","FundingSourceGroup"],"affected":["Charge.payment_method_details.link","ChargePaymentMethodDetailsLink","Charge::PaymentMethodDetail::Link","Charge.PaymentMethodDetail.Link","Charge.PaymentMethodDetails.Link"],"group":"Payments","category":"api","title":["Adds a funding source identifier to Link payments"]},{"id":"2026-08-12-customer-session-improvements","slug":"customer-session-improvements","products":["billing"],"breaking":false,"groupId":"billing","description":"Expands the [Customer Session](/api/customer_sessions?api-version=2026-08-26.dahlia) object to support the following new components: * `customer_portal`: Redirects a customer to their customer portal from the session so they can manage their subscriptions and payments. * `active_entitlements`: Shows a customer their active entitlements within the customer session.","impact":"You can now create a [Customer Session](/api/customer_sessions/create?api-version=2026-08-26.dahlia) on your server with the `customer_portal` or `active_entitlements` components enabled, then pass its `client_secret` to your client application. A client that holds the `client_secret` can:  * Retrieve the customer's [active Entitlements](/api/entitlements/active-entitlement?api-version=2026-08-26.dahlia) to gate access to features in your application. * Open the Stripe-hosted [customer portal](/customer-management/integrate-customer-portal) for that customer so they can manage their subscriptions, payment methods, and billing information. Your application presents the portal as an in-app sheet or in a browser, and the customer returns to your application when they're done.  These components don't change the behavior of the Payment Element. To get started, see [Manage subscriptions on iOS](/billing/subscriptions/manage-ios).","release":"2026-08-26.dahlia","train":"dahlia","changed":["customer_portal","active_entitlements","customerPortal","activeEntitlements","CustomerPortal","ActiveEntitlements"],"affected":["CustomerSession#create.components","CustomerSession.components","CustomerSessionCreateParams.components","CustomerSessionComponents","CustomerSessionComponentsParams","CustomerSession.create().$params.component","CustomerSession::Component","CustomerSession::CreateParams::Component","CustomerSession.Component","CustomerSession.CreateParamsComponent","CustomerSession.Components","CustomerSessionComponentsOptions"],"group":"Billing and invoicing","category":"api","title":["Adds the ability to query entitlements and launch the customer portal in Customer Sessions"]},{"id":"2026-08-13-adds-payment-method-error-codes","slug":"adds-payment-method-error-codes","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds the following new error codes to report failure states across payment method types, countries, and regions:  - `authentication_failure`  - `expired_payment_method`  - `incorrect_postal_code`  - `payment_method_restricted`  For detailed descriptions, see the [error codes](/error-codes) reference.","impact":"This change does not remove any error codes, so no immediate action is required. To support a wider range of error cases on the impacted endpoints, update your error handling to recognize `authentication_failure`, `expired_payment_method`, `incorrect_postal_code`, and `payment_method_restricted`.  The new code `payment_method_restricted` identifies issuer or platform restrictions such as those imposed after a card is reported lost or stolen. The other new error codes (`authentication_failure`, `expired_payment_method`, and `incorrect_postal_code`) are similar to existing error codes, but represent failures consistently across payment method types, countries, and regions.  Previously, authentication failures reflected their specific payment object, such as `payment_intent_authentication_failure` and `setup_intent_authentication_failure`, excluding other integration paths. Payment method expiration and postal code errors reflected card-specific `expired_card` and region-specific `incorrect_zip`, respectively, excluding the many other payment method types and regions.","release":"2026-08-26.dahlia","train":"dahlia","changed":["authentication_failure","expired_payment_method","incorrect_postal_code","payment_method_restricted"],"affected":["Invoice.last_finalization_error","PaymentIntent.last_payment_error","SetupAttempt.setup_error","SetupIntent.last_setup_error","StripeError","Terminal.Reader.action.api_error","Error","InvoiceLastFinalizationError","PaymentIntentLastPaymentError","SetupAttemptSetupError","SetupIntentLastSetupError","TerminalReaderActionApiError","Invoice.LastFinalizationError","PaymentIntent.LastPaymentError","SetupAttempt.SetupError","SetupIntent.LastSetupError","Terminal.Reader.Action.ApiError"],"group":"Payments","category":"api","title":["Adds new error codes for payment method failures"]},{"id":"2026-08-14-adds-frozen-fields-property-to-invoice-items","slug":"adds-frozen-fields-property-to-invoice-items","products":["invoicing"],"breaking":false,"groupId":"billing","description":"Adds the [frozen_fields](/api/invoiceitems/object?api-version=2026-08-26.dahlia#invoiceitem_object-frozen_fields) property to the [Invoice Item](/api/invoiceitems/object?api-version=2026-08-26.dahlia) object. This read-only array indicates which properties a user can't modify when updating an [invoice item](/api/invoiceitems/update?api-version=2026-08-26.dahlia), [invoice line item](/api/invoice-line-item/update?api-version=2026-08-26.dahlia), or [bulk line items](/api/invoice-line-item/invoices/update-lines/bulk?api-version=2026-08-26.dahlia). Possible values might include `discounts`, `pricing`, and `quantity`. Attempting to update a frozen property returns an error.","impact":"If your integration updates invoice items programmatically, check the `frozen_fields` property before making update requests. Modifying a property listed in `frozen_fields` returns a 400 error. Only invoice items with derived values (for example, prorations) have properties in `frozen_fields`.  To make changes to a property listed in the `frozen_fields` array, you must [delete the invoice item](/api/invoiceitems/delete?api-version=2026-08-26.dahlia) from the [Invoice](/api/invoices?api-version=2026-08-26.dahlia) and then [recreate the invoice item](/api/invoiceitems/create?api-version=2026-08-26.dahlia) that includes the updated values.","release":"2026-08-26.dahlia","train":"dahlia","changed":["frozen_fields","frozenFields","FrozenFields"],"affected":["InvoiceItem"],"group":"Billing and invoicing","category":"api","title":["Adds frozen fields property to Invoice Items"]},{"id":"2026-08-17-adds-billie-as-a-supported-payment-method-for-invoices-and-subscriptions","slug":"billie-support-for-invoices-and-subscriptions","products":["billing"],"breaking":false,"groupId":"billing","description":"Adds support for passing `billie` in `payment_settings.payment_method_types` when creating or updating an [Invoice](/api/invoices/create?api-version=2026-08-26.dahlia#create-payment_settings-payment_method_types) or [Subscription](/api/subscriptions/create?api-version=2026-08-26.dahlia#create_subscription-payment_settings-payment_method_types) with [collection_method](/api/invoices/object?api-version=2026-08-26.dahlia#invoice_object-collection_method) set to `send_invoice`.","impact":"If your invoice and subscription integrations use `payment_settings.payment_method_types` and `send_invoice`, you can include `billie` to let customers pay with Billie on the **Hosted Invoice** page of the customer portal. See [Configure payment methods for invoices](/invoicing/payment-methods) for enablement guidance in the Dashboard and API. Billie doesn't support invoices or subscriptions set to `charge_automatically`.","release":"2026-08-26.dahlia","train":"dahlia","changed":["billie"],"affected":["Invoice#update.payment_settings.payment_method_types","Invoice#create.payment_settings.payment_method_types","Subscription#update.payment_settings.payment_method_types","Subscription#create.payment_settings.payment_method_types","Invoice.payment_settings.payment_method_types","Subscription.payment_settings.payment_method_types","InvoiceUpdateParams.payment_settings.payment_method_types","InvoiceCreateParams.payment_settings.payment_method_types","SubscriptionUpdateParams.payment_settings.payment_method_types","SubscriptionCreateParams.payment_settings.payment_method_types","InvoiceUpdateParams.payment_settings.paymentMethodTypes","InvoiceCreateParams.payment_settings.paymentMethodTypes","SubscriptionUpdateParams.payment_settings.paymentMethodTypes","SubscriptionCreateParams.payment_settings.paymentMethodTypes","InvoicePaymentSettings.PaymentMethodTypes","SubscriptionPaymentSettings.PaymentMethodTypes","InvoiceModifyParamsPaymentSetting.payment_method_types","InvoiceCreateParamsPaymentSetting.payment_method_types","SubscriptionModifyParamsPaymentSetting.payment_method_types","SubscriptionCreateParamsPaymentSetting.payment_method_types","Invoice.PaymentSetting.payment_method_types","Subscription.PaymentSetting.payment_method_types"],"group":"Billing and invoicing","category":"api","title":["Adds support for the Billie payment method for invoices and subscriptions"]},{"id":"2026-08-17-adds-card-funding-type-filtering-to-checkout-sessions","slug":"adds-card-funding-type-filtering-to-checkout-sessions","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds the [funding_types_blocked](/api/checkout/sessions/create?api-version=2026-08-26.dahlia#create_checkout_session-payment_method_options-card-restrictions-funding_types_blocked) parameter to the [payment_method_options.card.restrictions](/api/checkout/sessions/create?api-version=2026-08-26.dahlia#create_checkout_session-payment_method_options-card-restrictions) hash on [Checkout Sessions](/api/checkout/sessions?api-version=2026-08-26.dahlia). This allows you to prevent cards with any of the specified funding types (`credit`, `debit`, and `prepaid`) from being used in the session.","impact":"You can now control which card funding types to accept at checkout by restricting certain funding types in the Checkout Session. For example, you can block prepaid cards to help reduce free-trial abuse or limit subscription payments to only credit cards. If the customer attempts to pay with a card of a restricted funding type, the Checkout Session shows an error.","release":"2026-08-26.dahlia","train":"dahlia","changed":["funding_types_blocked","fundingTypesBlocked","FundingTypesBlocked"],"affected":["Checkout.Session#create.payment_method_options.card.restrictions","Checkout.Session.payment_method_options.card.restrictions","Checkout.SessionCreateParams.payment_method_options.card.restrictions","checkout.Session.payment_method_options.card.restrictions","checkout.SessionCreateParams.payment_method_options.card.restrictions","CheckoutSessionPaymentMethodOptionsCardRestrictions","CheckoutSessionPaymentMethodOptionsCardRestrictionsParams","Checkout\\Session.create().$params.payment_method_option.card.restriction","Checkout::Session::PaymentMethodOption::Card::Restriction","Checkout::SessionCreateParams::PaymentMethodOption::Card::Restriction","Checkout.Session.PaymentMethodOption.Card.Restriction","checkout.SessionCreateParamsPaymentMethodOptionCardRestriction","Checkout.Session.PaymentMethodOptions.Card.Restrictions","CheckoutSessionPaymentMethodOptionsCardRestrictionsOptions"],"group":"Payments","category":"api","title":["Adds the ability to restrict card funding types in Checkout Sessions"]},{"id":"2026-08-17-adds-metadata-support-to-confirmation-tokens","slug":"adds-metadata-support-to-confirmation-tokens","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds a [metadata](/api/confirmation_tokens/object?api-version=2026-08-26.dahlia#confirmation_token_object-metadata) property to the [Confirmation Token](/api/confirmation_tokens/object?api-version=2026-08-26.dahlia) object. You can attach up to 50 key-value pairs of metadata when creating a ConfirmationToken through Stripe.js using [stripe.createConfirmationToken](/js/confirmation_tokens/create_confirmation_token). When you [retrieve a Confirmation Token](/api/confirmation_tokens/retrieve?api-version=2026-08-26.dahlia) with your secret key, it includes the [metadata](/api/confirmation_tokens/object?api-version=2026-08-26.dahlia#confirmation_token_object-metadata).","impact":"If your integration retrieves confirmation tokens on the server side, you can now pass metadata key-values along with the payment details, and the retrieved ConfirmationToken returns them in the [metadata](/api/confirmation_tokens/object?api-version=2026-08-26.dahlia#confirmation_token_object-metadata) property. See [metadata](/api/metadata?api-version=2026-08-26.dahlia) for more information.","release":"2026-08-26.dahlia","train":"dahlia","changed":["metadata","Metadata"],"affected":["ConfirmationToken"],"group":"Payments","category":"api","title":["Adds support for metadata in confirmation tokens"]},{"id":"2026-08-18-adds-funding-source-group-property-to-link-wallet-payments-on-card-charges","slug":"adds-funding-source-group-property-to-link-wallet-payments-on-card-charges","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds the [funding_source_group](/api/charges/object?api-version=2026-08-26.dahlia#charge_object-payment_method_details) property to `payment_method_details.card.wallet.link` of the Charge object. This property contains an identifier, prefixed with `lfsg_`, for the funding-source group selected for a {% $link.brand_name %} payment. It maps to the applicable pricing configuration in your Stripe pricing contract.","impact":"You can inspect `payment_method_details.card.wallet.link.funding_source_group` of a Charge to identify the funding-source group associated with a {% $link.brand_name %} payment and reconcile it with the applicable pricing configuration in your Stripe pricing contract.","release":"2026-08-26.dahlia","train":"dahlia","changed":["funding_source_group","fundingSourceGroup","FundingSourceGroup"],"affected":["Charge.payment_method_details.card.wallet.link","ChargePaymentMethodDetailsCardWalletLink","Charge::PaymentMethodDetail::Card::Wallet::Link","Charge.PaymentMethodDetail.Card.Wallet.Link","Charge.PaymentMethodDetails.Card.Wallet.Link"],"group":"Payments","category":"api","title":["Adds a funding source identifier to Link wallet card payments"]},{"id":"2026-08-25-adds-igic-tax-registration-type-with-place-of-supply-scheme-for-eu-countries","slug":"adds-igic-tax-registration-type-with-place-of-supply-scheme-for-eu-countries","products":["tax"],"breaking":false,"description":"Adds support to specify IGIC (Impue
