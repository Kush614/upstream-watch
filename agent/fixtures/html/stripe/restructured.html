tration.CountryOptions.Pt","Tax.Registration.CountryOptions.Ro","Tax.Registration.CountryOptions.Se","Tax.Registration.CountryOptions.Si","Tax.Registration.CountryOptions.Sk","TaxRegistrationCountryOptionsAtOptions","TaxRegistrationCountryOptionsBeOptions","TaxRegistrationCountryOptionsBgOptions","TaxRegistrationCountryOptionsCyOptions","TaxRegistrationCountryOptionsCzOptions","TaxRegistrationCountryOptionsDeOptions","TaxRegistrationCountryOptionsDkOptions","TaxRegistrationCountryOptionsEeOptions","TaxRegistrationCountryOptionsEsOptions","TaxRegistrationCountryOptionsFiOptions","TaxRegistrationCountryOptionsFrOptions","TaxRegistrationCountryOptionsGrOptions","TaxRegistrationCountryOptionsHrOptions","TaxRegistrationCountryOptionsHuOptions","TaxRegistrationCountryOptionsIeOptions","TaxRegistrationCountryOptionsItOptions","TaxRegistrationCountryOptionsLtOptions","TaxRegistrationCountryOptionsLuOptions","TaxRegistrationCountryOptionsLvOptions","TaxRegistrationCountryOptionsMtOptions","TaxRegistrationCountryOptionsNlOptions","TaxRegistrationCountryOptionsPlOptions","TaxRegistrationCountryOptionsPtOptions","TaxRegistrationCountryOptionsRoOptions","TaxRegistrationCountryOptionsSeOptions","TaxRegistrationCountryOptionsSiOptions","TaxRegistrationCountryOptionsSkOptions"],"category":"api","title":["Adds support for specifying place of supply scheme on IGIC tax in the EU"]},{"id":"2026-08-25-flexible-subscription-item-limits","slug":"flexible-subscription-item-limits","products":["billing"],"breaking":false,"groupId":"billing","description":"Raises the subscription item limit from 20 to 100 for [flexible billing mode](/billing/subscriptions/billing-mode) [subscriptions](/api/subscriptions/object?api-version=2026-08-26.dahlia#subscription_object-items) and [subscription schedules](/api/subscription_schedules/object?api-version=2026-08-26.dahlia#subscription_schedule_object-phases-items). This change applies to all API versions.","impact":"You can now add up to 100 items when creating or updating subscriptions set to flexible billing mode. Existing integrations require no changes unless you need more than 20 items.","release":"2026-08-26.dahlia","train":"dahlia","changed":[],"affected":[],"group":"Billing and invoicing","category":"api","title":["Increases the subscription item limit"]}]},{"published":"2026-08-26","title":"2026-08-26.preview","isHistorical":false,"channel":"preview","groups":[{"id":"payments","title":"Payments"},{"id":"connect","title":"Connect"}],"entries":[{"id":"2026-08-12-disable-payout-methods","slug":"disable-payout-methods","products":["payouts"],"breaking":true,"description":"Adds the ability to [disable](/api/v2/money-management/payout-methods/disable?api-version=2026-08-26.preview) a [v2 Payout Method](/api/v2/money-management/payout-methods?api-version=2026-08-26.preview) for use in outbound money movement, which labels the [usage_status](/api/v2/money-management/payout-methods/object?api-version=2026-08-26.preview#v2_payout_method_object-usage_status) as `disabled` for `payments` and `transfers`.","breakingDescription":"A payout method can now show `disabled` as the `usage_status` for `payments` and `transfers`. If your integration doesn't handle payment methods with this value, you might experience unexpected failures.","impact":"You can now disable a v2 Payout Method to prevent using that payout method for outbound money movement. The resulting status is non-terminal, and you can re-enable the payout method  by creating a new [Outbound Setup Intent](/api/v2/money-management/outbound-setup-intents?api-version=2026-08-26.preview).","release":"2026-08-26.preview","train":"dahlia","changed":["disable","disabled","default_payout_method_cannot_be_disabled","Disable"],"affected":["V2.MoneyManagement.PayoutMethod","V2.MoneyManagement.PayoutMethod.usage_status.payments","V2.MoneyManagement.PayoutMethod.usage_status.transfers","V2.MoneyManagement.PayoutMethod#list.usage_status.payments","V2.MoneyManagement.PayoutMethod#list.usage_status.transfers","cannot_proceed","V2.MoneyManagement.PayoutMethodListParams.usage_status.payments","V2.MoneyManagement.PayoutMethodListParams.usage_status.transfers","CannotProceedError","v2.moneymanagement.PayoutMethod","v2.moneymanagement.PayoutMethodListParams.usage_status.payments","v2.moneymanagement.PayoutMethodListParams.usage_status.transfers","V2MoneyManagementPayoutMethod","V2MoneyManagementPayoutMethodUsageStatus.Payments","V2MoneyManagementPayoutMethodUsageStatus.Transfers","V2::MoneyManagement::PayoutMethod","v2.money_management.PayoutMethod","V2.MoneyManagement.PayoutMethod.UsageStatus.payments","V2.MoneyManagement.PayoutMethod.UsageStatus.transfers","v2.money_management.PayoutMethodListParamsUsageStatus.payments","v2.money_management.PayoutMethodListParamsUsageStatus.transfers"],"category":"api","title":["Adds support for disabling payout methods"]},{"id":"2026-08-14-widens-the-price-property-on-trial-offers-to-include-deleted-prices","slug":"trial-offers-return-deleted-prices","products":["billing"],"breaking":true,"description":"Expands the [Trial Offer](/api/product-catalog/trial-offer?api-version=2026-08-26.preview) object's [price](/api/product-catalog/trial-offer/object?api-version=2026-08-26.preview#product_catalog_trial_offer_object-price) property and [end_behavior.transition.price](/api/product-catalog/trial-offer/object?api-version=2026-08-26.preview#product_catalog_trial_offer_object-end_behavior-transition-price) property to return a deleted [Price](/api/prices/object?api-version=2026-08-26.preview) object when the referenced Price has been deleted. Previously, expanding either property when its referenced Price was deleted returned an error. When expanded, the property can now return a Price object with `deleted` set to `true`.","breakingDescription":"The `price` property on the Trial Offer object previously always returned a full Price object when expanded. It can now return a deleted Price object with `deleted` set to `true`. If your code assumes the expanded value is always a full Price object, you must update it to handle a deleted price.","impact":"You can now view deleted price values when you expand the `price` property on a [Trial Offer](/api/product-catalog/trial-offer?api-version=2026-08-26.preview). Previously, expanding the `price` property on a Trial Offer with a deleted price returned an error. Update your integration to handle the case where the returned price has `deleted` set to `true`.","release":"2026-08-26.preview","train":"dahlia","changed":["ProductCatalog.TrialOffer.end_behavior.transition.price","ProductCatalog.TrialOffer.price","productcatalog.TrialOffer.end_behavior.transition.price","productcatalog.TrialOffer.price","ProductCatalogTrialOffer.Price","ProductCatalogTrialOfferEndBehaviorTransition.Price","ProductCatalog::TrialOffer.price","ProductCatalog::TrialOffer::EndBehavior::Transition.price","ProductCatalog.TrialOffer.EndBehavior.Transition.price","ProductCatalog.TrialOffer.EndBehavior.Transition.Price","ProductCatalog.TrialOffer.Price"],"affected":["$Price \u2192 deletable($Price)","Price \u2192 deletable($Price)"],"category":"api","title":["Includes deleted prices in trial offer price data"]},{"id":"2026-08-19-removes-the-payment-method-types-parameter-from-payment-intents-and-setup-intents","slug":"removes-payment-method-types-parameter-from-payment-intents-setup-intents","products":["payments"],"breaking":true,"groupId":"payments","description":"Removes `payment_method_types` as a writable parameter from the [create](/api/payment_intents/create?api-version=2026-08-26.preview), [update](/api/payment_intents/update?api-version=2026-08-26.preview), and [confirm](/api/payment_intents/confirm?api-version=2026-08-26.preview) methods on Payment Intents, and from the [create](/api/setup_intents/create?api-version=2026-08-26.preview) and [update](/api/setup_intents/update?api-version=2026-08-26.preview) methods on Setup Intents. Passing `payment_method_types` now returns a 400 error with the code `payment_method_types_no_longer_supported`.   The [PaymentIntent](/api/payment_intents/object?api-version=2026-08-26.preview#payment_intent_object-payment_method_types) and [SetupIntent](/api/setup_intents/object?api-version=2026-08-26.preview#setup_intent_object-payment_method_types) objects still return `payment_method_types` as a read-only property, reflecting the computed list of available payment methods.","breakingDescription":"Previously, `payment_method_types` accepted a list of payment method types to explicitly set which methods to present on a Payment Intent or Setup Intent. This change disables writing to this parameter and returns a `400` error on requests that pass `payment_method_types` on the affected endpoints.","impact":"If your integration passes `payment_method_types` when creating, updating, or confirming a PaymentIntent or SetupIntent, you must remove it before upgrading to API version `2026-08-26.preview` or later.   You can replace it with [dynamic payment methods](/payments/payment-methods/dynamic-payment-methods) to automatically determine available payment methods based on other parameters such as `currency`, `amount`, and `customer`. If you need more control:  * Use [excluded_payment_method_types](/api/payment_intents/create?api-version=2026-08-26.preview#create_payment_intent-excluded_payment_method_types) to exclude specific types from the set determined by dynamic payment methods. * Use [allowed_payment_method_types](/api/payment_intents/create?api-version=2026-08-26.preview#create_payment_intent-allowed_payment_method_types) to specify a list of types you want to accept. Stripe filters out incompatible types instead of returning an error.  You can continue to read `payment_method_types` to retrieve the computed list of available payment methods.","release":"2026-08-26.preview","train":"dahlia","changed":["payment_method_types","paymentMethodTypes","PaymentMethodTypes"],"affected":["PaymentIntent#confirm","PaymentIntent#create","PaymentIntent#update","SetupIntent#create","SetupIntent#update","PaymentIntentConfirmParams","PaymentIntentCreateParams","PaymentIntentUpdateParams","SetupIntentCreateParams","SetupIntentUpdateParams","PaymentIntentParams","SetupIntentParams","PaymentIntent.confirm().$params","PaymentIntent.create().$params","PaymentIntent.update().$params","SetupIntent.create().$params","SetupIntent.update().$params","PaymentIntentModifyParams","SetupIntentModifyParams","PaymentIntentConfirmOptions","PaymentIntentCreateOptions","PaymentIntentUpdateOptions","SetupIntentCreateOptions","SetupIntentUpdateOptions"],"group":"Payments","category":"api","title":["Removes support for specifying payment method types in Payment Intents and Setup Intents"]},{"id":"2026-08-21-updates-payout-method-and-vault-bank-account-resources-in-api-v2","slug":"updates-v2-payout-method-and-vault-bank-account-resources","products":["payments"],"breaking":true,"groupId":"payments","description":"- Renames the `enabled_delivery_options` property to [enabled_delivery_schemes](/api/v2/money-management/payout-methods/object?api-version=2026-08-26.preview#v2_payout_method_object-bank_account-enabled_delivery_schemes) on the [bank_account](/api/v2/money-management/payout-methods/object?api-version=2026-08-26.preview#v2_payout_method_object-bank_account) hash of the [v2 Payout Method](/api/v2/money-management/payout-methods?api-version=2026-08-26.preview) object. The new name better reflects that the property represents delivery schemes rather than generic options. - Adds the [restricted](/api/v2/core/vault/us-bank-accounts/object?api-version=2026-08-26.preview#v2_us_bank_account_object-restricted) property to [US Bank Account](/api/v2/core/vault/us-bank-accounts/object?api-version=2026-08-26.preview) and [GB Bank Account](/api/v2/core/vault/gb-bank-accounts/object?api-version=2026-08-26.preview) vault resources. This boolean property indicates whether a user can use a correctly configured bank account for money movement. Without this field, users might infer blocked transactions as invalid configuration.","breakingDescription":"Integrations that reference the `enabled_delivery_options` property of the v2 Payout Methods object's `bank_account` hash won't receive expected data and might receive errors if they don't handle the renamed property in their integration.","impact":"If your integration reads the `enabled_delivery_options` property from v2 Payout Method Bank Account objects, you must update your code to use `enabled_delivery_schemes` instead.   You can also now inspect the `restricted` property on vault bank accounts to determine whether a bank account can receive payouts on Stripe. This new functionality isn't breaking and requires no change if you choose not to use it.","release":"2026-08-26.preview","train":"dahlia","changed":["restricted","enabled_delivery_schemes","enabled_delivery_options","enabledDeliverySchemes","enabledDeliveryOptions","Restricted","EnabledDeliverySchemes","EnabledDeliveryOptions"],"affected":["V2.Core.Vault.GbBankAccount","V2.Core.Vault.UsBankAccount","V2.MoneyManagement.PayoutMethod.bank_account","v2.core.vault.GbBankAccount","v2.core.vault.UsBankAccount","v2.moneymanagement.PayoutMethod.bank_account","V2CoreVaultGbBankAccount","V2CoreVaultUsBankAccount","V2MoneyManagementPayoutMethodBankAccount","V2::Core::Vault::GbBankAccount","V2::Core::Vault::UsBankAccount","V2::MoneyManagement::PayoutMethod::BankAccount","V2.MoneyManagement.PayoutMethod.BankAccount"],"group":"Payments","category":"api","title":["Updates bank account and payout method resources for Global Payouts"]},{"id":"2026-08-14-introduces-approval-requests-in-public-preview","slug":"introduces-approval-requests-in-public-preview","products":[],"breaking":false,"description":"Introduces the [Approval Requests v2](/api/v2/core/approval-requests/object?api-version=2026-08-26.preview#v2_approval_request_object) API in public preview. Use this API to require explicit approval before Stripe executes sensitive actions on your account, such as creating charges, payouts, transfers, or refunds. The API supports create, update, list, retrieve, and cancel endpoints.  Approval Requests support actions across payments, billing, and money movement, including charge creation, payout creation, transfer creation, refund creation, and subscription updates.  Stripe sends the following events related to Approval Request activity:  - `v2.core.approval_request.created` - `v2.core.approval_request.approved` - `v2.core.approval_request.rejected` - `v2.core.approval_request.canceled` - `v2.core.approval_request.expired` - `v2.core.approval_request.succeeded` - `v2.core.approval_request.failed`","impact":"You can configure rules that require Stripe to obtain human approval before processing high-risk or sensitive API actions on your account. Listen for [Approval Request webhook events](/account/approvals#webhooks-events) to build automated notification and review systems that integrate with your existing operational tooling.","release":"2026-08-26.preview","train":"dahlia","changed":["cancel","list","retrieve","update","V2CoreApprovalRequestApprovedEvent","V2CoreApprovalRequestCanceledEvent","V2CoreApprovalRequestCreatedEvent","V2CoreApprovalRequestExpiredEvent","V2CoreApprovalRequestFailedEvent","V2CoreApprovalRequestRejectedEvent","V2CoreApprovalRequestSucceededEvent","Cancel","Get","List","Update","all","modify"],"affected":["V2.Core.ApprovalRequest","v2.core.ApprovalRequest","V2CoreApprovalRequest","V2::Core::ApprovalRequest"],"category":"api","title":["Adds ability to require approval for Stripe-initiated actions"]},{"id":"2026-08-17-adds-default-payout-methods-to-the-accounts-v2-api","slug":"adds-default-payout-methods-to-the-accounts-v2-api","products":["connect","treasury"],"breaking":false,"description":"Adds the `defaults.payout_methods` property to the [Account](/api/v2/core/accounts/object?api-version=2026-08-26.preview) object in the Accounts v2 API. This property is a per-currency hash that maps ISO currency codes to [Payout Method](/api/v2/money-management/payout-methods/object?api-version=2026-08-26.preview) IDs, letting you specify which payout method to use by default for each currency when you [update](/api/v2/core/accounts/update?api-version=2026-08-26.preview) an `Account`. To unset a default for a specific currency, pass an empty string as the value.","impact":"You can now specify different default payout methods for an account, depending on the currency. [Global Payouts](/global-payouts) uses these defaults when sending money to your recipients.  If your integration previously used `configuration.recipient.default_outbound_destination` to set a default [Payout Method](/api/v2/money-management/payout-methods/object?api-version=2026-08-26.preview), you must now use `defaults.payout_methods` to manage default [Payout Method](/api/v2/money-management/payout-methods/object?api-version=2026-08-26.preview) assignment. Any existing values you set for your recipients through `configuration.recipient.default_outbound_destination` are now reflected in `defaults.payout_methods` on the recipient's `Account` object.  For Connect integrations that use v2 [Payout Methods](/api/v2/money-management/payout-methods/object?api-version=2026-08-26.preview), `defaults.payout_methods` reflect the configured payout methods for your connected accounts.","release":"2026-08-26.preview","train":"dahlia","changed":["payout_methods","payoutMethods","PayoutMethods"],"affected":["V2.Core.Account#update.defaults","V2.Core.Account.defaults","V2.Core.AccountUpdateParams.defaults","v2.core.Account.defaults","v2.core.AccountUpdateParams.defaults","V2CoreAccountDefaults","V2CoreAccountDefaultsParams","V2\\Core\\Account.update().$params.default","V2::Core::Account::Default","V2::Core::AccountUpdateParams::Default","V2.Core.Account.Default","v2.core.AccountModifyParamsDefault","V2.Core.Account.Defaults","V2CoreAccountDefaultsOptions"],"category":"api","title":["Adds support to specify different default payout methods for each currency"]},{"id":"2026-08-17-blocks-unsupported-integration-patterns","slug":"2026-08-17-blocks-unsupported-integration-patterns","products":["connect"],"breaking":false,"groupId":"connect","description":"Adds errors to various APIs to prevent new platforms from using a legacy integration patten, such as [direct charges](/connect/direct-charges) for [legacy Express](/connect/express-accounts) and [legacy Custom](/connect/custom-accounts) accounts. Also provides a [Connect setting in the Dashboard](https://dashboard.stripe.com/settings/connect/platform-profile) where platforms with legitimate use cases can request an exemption.","impact":"New platforms integrating with Connect who attempt to set up direct charges with a [legacy Express](/connect/express-accounts) or [legacy Custom](/connect/custom-accounts) account might receive an error because Stripe recommends [destination charges](/connect/destination-charges) for these types of accounts. This change doesn't affect existing platforms.","release":"2026-08-26.preview","train":"dahlia","changed":[],"affected":[],"group":"Connect","category":"api","title":["Redirects new Connect platforms away from unsupported integration patterns"]},{"id":"2026-08-21-adds-disable-stripe-user-authentication-to-payment-method-settings","slug":"payment-method-settings-disable-stripe-user-authentication","products":["connect"],"breaking":false,"groupId":"connect","description":"Adds the nullable `disable_stripe_user_authentication` boolean property to the `features` hash for the [Payment Method Settings embedded component](/connect/supported-embedded-components/payment-method-settings) when you [create an Account Session](/api/account_sessions/create?api-version=2026-08-26.preview).","impact":"You can now disable Stripe authentication in the Payment Method Settings embedded component for eligible connected accounts where your platform collects requirements. Set `components.payment_method_settings.features.disable_stripe_user_authentication` to `true`. The property defaults to `false`, so existing integrations aren't affected. See [Disable Stripe user authentication](/connect/supported-embedded-components/payment-method-settings#disable-stripe-user-authentication) for eligibility and configuration details.","release":"2026-08-26.preview","train":"dahlia","changed":["disable_stripe_user_authentication","disableStripeUserAuthentication","DisableStripeUserAuthentication"],"affected":["AccountSession#create.components.payment_method_settings.features","AccountSession.components.payment_method_settings.features","AccountSessionCreateParams.components.payment_method_settings.features","AccountSessionComponentsPaymentMethodSettingsFeatures","AccountSessionComponentsPaymentMethodSettingsFeaturesParams","AccountSession.create().$params.component.payment_method_settings.feature","AccountSession::Component::PaymentMethodSetting::Feature","AccountSessionCreateParams::Component::PaymentMethodSetting::Feature","AccountSession.Component.PaymentMethodSetting.Feature","AccountSessionCreateParamsComponentPaymentMethodSettingFeature","AccountSession.Components.PaymentMethodSettings.Features","AccountSessionComponentsPaymentMethodSettingsFeaturesOptions"],"group":"Connect","category":"api","title":["Adds control over Stripe user authentication to Payment Method Settings"]},{"id":"2026-08-25-adds-account-signals-account-evaluations-and-account-activity-apis-in-public-preview","slug":"adds-account-signals-account-evaluations-and-account-activity-apis-in-public-preview","products":["radar","connect"],"breaking":false,"groupId":"connect","description":"Introduces the following v2 APIs in public preview:  - [Account Evaluation](/api/v2/signals/account-evaluations?api-version=2026-08-26.preview): Request evaluations for the `user_account_sharing` and `user_multi_accounting` [requested_signals](/api/v2/signals/account-evaluations/object?api-version=2026-08-26.preview#v2_signals_account_evaluation_object-requested_signals) types. This API sends the `v2.signals.account_evaluation.complete` event when all pending evaluation signals finish processing so you can use the risk signal result to direct your decision. - [Account Activity](/api/v2/signals/account-activities?api-version=2026-08-26.preview): Create account activity events, such as login and registration attempts, to use in requesting evaluations, then report the outcome to Stripe to reconcile your risk-signal based decisions and improve future evaluations. You can create  retrieve, and delete recorded activities. - [Account Signal](/api/v2/signals/account-signals?api-version=2026-08-26.preview): List and retrieve individual risk signals generated for accounts.","impact":"You can now send account activity data, such as login and registration attempts, to Stripe's Signals APIs and request on-demand evaluations about whether your accounts might be engaged in account sharing or multi-accounting. Stripe returns a risk score to help you manage your abuse prevention strategy. You can also report the action you take based on the risk evaluation results and look up individual past signals.","release":"2026-08-26.preview","train":"dahlia","changed":["list","retrieve","create","delete","V2SignalsAccountEvaluationCompleteEvent","del","Get","List","New","Del","all","Create","Delete"],"affected":["V2.Signals.AccountSignal","V2.Signals.AccountEvaluation","V2.Signals.AccountActivity","v2.signals.AccountSignal","v2.signals.AccountEvaluation","v2.signals.AccountActivity","V2SignalsAccountSignal","V2SignalsAccountEvaluation","V2SignalsAccountActivity","V2::Signals::AccountSignal","V2::Signals::AccountEvaluation","V2::Signals::AccountActivity"],"group":"Connect","category":"api","title":["Adds Account Signals, Account Evaluations, and Account Activity APIs in public preview"]}]}]},{"title":"Clover","versions":[{"published":"2026-02-25","title":"2026-02-25.clover","isHistorical":false,"channel":"public","groups":[{"id":"payments","title":"Payments and payment method enhancements"},{"id":"billing","title":"Billing enhancements"},{"id":"terminal","title":"Terminal enhancements"},{"id":"tax","title":"Tax enhancements"}],"entries":[{"id":"2026-01-29-adds-display-name-and-service-user-number-to-bacs-direct-debit-mandates","slug":"display-name-and-service-user-number","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds the [display_name](/api/mandates/object?api-version=2026-02-25.clover#mandate_object-payment_method_details-bacs_debit-display_name) and [service_user_number](/api/mandates/object?api-version=2026-02-25.clover#mandate_object-payment_method_details-bacs_debit-service_user_number) properties to the [Mandate](/api/mandates/object?api-version=2026-02-25.clover) object for [Bacs Direct Debit](/payments/payment-methods/bacs-debit) transactions. The `display_name` is the display name for the account on the mandate. The `service_user_number` is the service user number for the account on the mandate.  These properties provide information for Bacs Direct Debit transactions, helping platforms to manage custom branding across multiple connected accounts.","impact":"You can now access the display name and service user number for Bacs Direct Debit mandates. This information helps you provide better customer support by matching payments to the names customers see on their bank statements, and enables more detailed reconciliation and reporting for your Bacs Direct Debit transactions.  If you're building customer-facing interfaces or reporting tools that display mandate information, you can now include these additional identification details to improve clarity and transparency.","release":"2026-02-25.clover","train":"clover","changed":["display_name","service_user_number","displayName","serviceUserNumber","DisplayName","ServiceUserNumber"],"affected":["Mandate.payment_method_details.bacs_debit","MandatePaymentMethodDetailsBacsDebit","Mandate::PaymentMethodDetail::BacsDebit","Mandate.PaymentMethodDetail.BacsDebit","Mandate.PaymentMethodDetails.BacsDebit"],"group":"Payments and payment method enhancements","category":"api","title":["Adds display name and service user number to Bacs Direct Debit mandates"]},{"id":"2026-01-29-adds-settlement-type-field-to-fee-objects","slug":"settlement-type","products":[],"breaking":false,"description":"Adds the [settlement_type](/api/application_fees/object?api-version=2026-02-25.clover#application_fee_object-settlement_type) property to [Application Fee](/api/application_fees/object?api-version=2026-02-25.clover) objects. This property indicates whether fees are settled on a net or gross basis.  The `settlement_type` property can have the following values: - `net_settled`: The fee is settled at charge time - `gross_settled`: The fee is settled at the end of a billing cycle  Previously, there was no way to programmatically determine how fees were settled, making it difficult to reconcile payments and understand the exact settlement amounts.","impact":"You can now use the `settlement_type` property to: - Distinguish between different settlement types - Build more precise financial reporting for your platform  If you currently rely on external calculations to determine settlement amounts, you can now use this property to get the settlement type directly from the API response.","release":"2026-02-25.clover","train":"clover","changed":["settlement_type","settlementType","SettlementType"],"affected":["ApplicationFee"],"category":"api","title":["Adds settlement type to Application Fee objects"]},{"id":"2026-01-30-adds-terminal-reader-and-location-to-payment-method-details","slug":"terminal-reader-and-location","products":["payments","terminal"],"breaking":false,"groupId":"terminal","description":"Adds support for retrieving the Terminal [reader](/api/charges/object?api-version=2026-02-25.clover#charge_object-payment_method_details-card_present-reader) and [location](/api/charges/object?api-version=2026-02-25.clover#charge_object-payment_method_details-card_present-location) associated with [card present](/api/charges/object?api-version=2026-02-25.clover#charge_object-payment_method_details-card_present) and [Interac present](/api/charges/object?api-version=2026-02-25.clover#charge_object-payment_method_details-interac_present) charges.","impact":"You can now access the Terminal reader and location related to a card present or Interac present transaction.","release":"2026-02-25.clover","train":"clover","changed":["location","reader","Location","Reader"],"affected":["Charge.payment_method_details.card_present","Charge.payment_method_details.interac_present","ConfirmationToken.payment_method_preview.card.generated_from.payment_method_details.card_present","PaymentAttemptRecord.payment_method_details.card_present","PaymentAttemptRecord.payment_method_details.interac_present","PaymentMethod.card.generated_from.payment_method_details.card_present","PaymentRecord.payment_method_details.card_present","PaymentRecord.payment_method_details.interac_present","ChargePaymentMethodDetailsCardPresent","ChargePaymentMethodDetailsInteracPresent","ConfirmationTokenPaymentMethodPreviewCardGeneratedFromPaymentMethodDetailsCardPresent","PaymentAttemptRecordPaymentMethodDetailsCardPresent","PaymentAttemptRecordPaymentMethodDetailsInteracPresent","PaymentMethodCardGeneratedFromPaymentMethodDetailsCardPresent","PaymentRecordPaymentMethodDetailsCardPresent","PaymentRecordPaymentMethodDetailsInteracPresent","Charge::PaymentMethodDetail::CardPresent","Charge::PaymentMethodDetail::InteracPresent","ConfirmationToken::PaymentMethodPreview::Card::GeneratedFrom::PaymentMethodDetail::CardPresent","PaymentAttemptRecord::PaymentMethodDetail::CardPresent","PaymentAttemptRecord::PaymentMethodDetail::InteracPresent","PaymentMethod::Card::GeneratedFrom::PaymentMethodDetail::CardPresent","PaymentRecord::PaymentMethodDetail::CardPresent","PaymentRecord::PaymentMethodDetail::InteracPresent","Charge.PaymentMethodDetail.CardPresent","Charge.PaymentMethodDetail.InteracPresent","ConfirmationToken.PaymentMethodPreview.Card.GeneratedFrom.PaymentMethodDetail.CardPresent","PaymentAttemptRecord.PaymentMethodDetail.CardPresent","PaymentAttemptRecord.PaymentMethodDetail.InteracPresent","PaymentMethod.Card.GeneratedFrom.PaymentMethodDetail.CardPresent","PaymentRecord.PaymentMethodDetail.CardPresent","PaymentRecord.PaymentMethodDetail.InteracPresent","Charge.PaymentMethodDetails.CardPresent","Charge.PaymentMethodDetails.InteracPresent","ConfirmationToken.PaymentMethodPreview.Card.GeneratedFrom.PaymentMethodDetails.CardPresent","PaymentAttemptRecord.PaymentMethodDetails.CardPresent","PaymentAttemptRecord.PaymentMethodDetails.InteracPresent","PaymentMethod.Card.GeneratedFrom.PaymentMethodDetails.CardPresent","PaymentRecord.PaymentMethodDetails.CardPresent","PaymentRecord.PaymentMethodDetails.InteracPresent"],"group":"Terminal enhancements","category":"api","title":["Adds Terminal reader and location to payment method details"]},{"id":"2026-01-30-expands-cellular-configuration-property-availability-to-all-sdks","slug":"terminal-cellular-configuration","products":["terminal"],"breaking":false,"groupId":"terminal","description":"Adds the [cellular](/api/terminal/configuration/object?api-version=2026-02-25.clover#terminal_configuration_object-cellular) hash to the [Configuration](/api/terminal/configuration/object?api-version=2026-02-25.clover) object for Terminal readers. The [cellular.enabled](/api/terminal/configuration/object?api-version=2026-02-25.clover#terminal_configuration_object-cellular-enabled) parameter allows you to configure whether a cellular-capable Terminal reader can connect to the internet over cellular connectivity.","impact":"You can now programmatically manage cellular connectivity settings for your Terminal readers. This enables you to:  - Configure cellular connectivity settings when [creating Terminal configurations](/api/terminal/configuration/create?api-version=2026-02-25.clover) - Modify cellular connectivity settings when [updating existing configurations](/api/terminal/configuration/update?api-version=2026-02-25.clover) - Retrieve cellular configuration status when [fetching Terminal configuration details](/api/terminal/configuration/retrieve?api-version=2026-02-25.clover)","release":"2026-02-25.clover","train":"clover","changed":["cellular","Cellular"],"affected":["Terminal.Configuration","Terminal.Configuration#create","Terminal.Configuration#update","Terminal.ConfigurationCreateParams","Terminal.ConfigurationUpdateParams","terminal.Configuration","terminal.ConfigurationCreateParams","terminal.ConfigurationUpdateParams","TerminalConfiguration","TerminalConfigurationParams","Terminal\\Configuration.create().$params","Terminal\\Configuration.update().$params","Terminal::Configuration","Terminal::ConfigurationCreateParams","Terminal::ConfigurationUpdateParams","terminal.ConfigurationModifyParams","Terminal.ConfigurationCreateOptions","Terminal.ConfigurationUpdateOptions"],"group":"Terminal enhancements","category":"api","title":["Adds the ability to manage cellular connectivity settings for Terminal readers"]},{"id":"2026-02-04-makes-pay-by-bank-permanently-available-in-the-billing-api","slug":"billing-api-pay-by-bank","products":["billing","payments"],"breaking":false,"groupId":"billing","description":"Adds [Pay by Bank](/payments/pay-by-bank) (`pay_by_bank`) as a supported payment method in the [Billing](/billing) API. You can use Pay by Bank for [invoices](/api/invoices/object?api-version=2026-02-25.clover#invoice_object-payment_settings-payment_method_types), [subscriptions](/api/subscriptions/object?api-version=2026-02-25.clover#subscription_object-payment_settings-payment_method_types), [customers](/api/customers/object?api-version=2026-02-25.clover#customer_object-subscriptions-data-payment_settings-payment_method_types), and [quotes](/api/quotes?api-version=2026-02-25.preview) billing operations.","impact":"Pay by Bank provides customers with a direct bank transfer option for recurring billing scenarios, reducing payment processing costs and improving payment success rates for certain customer segments.  Adding Pay by Bank into your billing workflows requires no special configuration or feature enablement. Your existing Pay by Bank integrations continue to function without requiring any changes.","release":"2026-02-25.clover","train":"clover","changed":["pay_by_bank"],"affected":["Invoice#update.payment_settings","Invoice#create.payment_settings","Invoice.payment_settings","Subscription#update.payment_settings","Subscription#create.payment_settings","Subscription.payment_settings","InvoiceUpdateParams.payment_settings","InvoiceCreateParams.payment_settings","SubscriptionUpdateParams.payment_settings","SubscriptionCreateParams.payment_settings","InvoicePaymentSettings","SubscriptionPaymentSettings","InvoiceModifyParamsPaymentSetting","InvoiceCreateParamsPaymentSetting","Invoice.PaymentSetting","SubscriptionModifyParamsPaymentSetting","SubscriptionCreateParamsPaymentSetting","Subscription.PaymentSetting"],"group":"Billing enhancements","category":"api","title":["Adds Pay by Bank to the Billing API"]},{"id":"2026-02-11-adds-payment-behavior-control-for-subscription-item-deletion","slug":"subscription-item-deletion-payment-behavior-control","products":["billing"],"breaking":false,"groupId":"billing","description":"You can specify the [payment_behavior](/api/subscription_items/delete?api-version=2026-02-25.clover#delete_subscription_item-payment_behavior) parameter when you [delete a subscription item](/api/subscription_items/delete?api-version=2026-02-25.clover). Setting `payment_behavior=pending_if_incomplete` stages the deletion as a pending update when the change would generate an invoice that requires payment, rather than deleting the item immediately.","impact":"This new approach maintains consistency in your subscription management workflow and prevents items from being removed before payment is confirmed. Further, this change aligns subscription item deletion with the existing pending update behavior available when [adding](/api/subscription_items/create?api-version=2026-02-25.clover#create_subscription_item-payment_behavior) and [modifying](/api/subscription_items/update?api-version=2026-02-25.clover#update_subscription_item-payment_behavior) subscription items. Previously, you could only delete subscription items immediately, which could create inconsistencies in how subscription changes are handled across different operations.","release":"2026-02-25.clover","train":"clover","changed":["payment_behavior","paymentBehavior","PaymentBehavior"],"affected":["SubscriptionItem#delete","SubscriptionItemDeleteParams","SubscriptionItemParams","SubscriptionItem.delete().$params","SubscriptionItemDeleteOptions"],"group":"Billing enhancements","category":"api","title":["Adds payment behavior control for subscription item deletion"]},{"id":"2026-02-11-adds-sri-lanka-to-tax-registrations","slug":"tax-registrations-sri-lanka","products":["tax"],"breaking":false,"groupId":"tax","description":"Adds the [lk](/api/tax/registrations/object?api-version=2026-02-25.clover#tax_registration_object-country_options-lk) parameter to the [country_options](/api/tax/registrations/object?api-version=2026-02-25.clover#tax_registration_object-country_options) hash on the [Tax Registration](/api/tax/registrations/object?api-version=2026-02-25.clover) object to support tax collection in Sri Lanka (LK) for digital services. The [type](/api/tax/registrations/create?api-version=2026-02-25.clover#tax_registration_create-country_options-lk-type) must be set to `simplified` when [creating](/api/tax/registrations/create?api-version=2026-02-25.clover) a Tax Registration for Sri Lanka.","impact":"If you sell digital products to customers in Sri Lanka, you can now use [Stripe Tax](/tax) to automatically manage tax registration for this jurisdiction. This change allows you to comply with local tax obligations while automating the tax collection process.","release":"2026-02-25.clover","train":"clover","changed":["lk","Lk"],"affected":["Tax.Registration#create.country_options","Tax.Registration.country_options","Tax.RegistrationCreateParams.country_options","tax.Registration.country_options","tax.RegistrationCreateParams.country_options","TaxRegistrationCountryOptions","TaxRegistrationCountryOptionsParams","Tax\\Registration.create().$params.country_option","Tax::Registration::CountryOption","Tax::RegistrationCreateParams::CountryOption","Tax.Registration.CountryOption","tax.RegistrationCreateParamsCountryOption","Tax.Registration.CountryOptions","TaxRegistrationCountryOptionsOptions"],"group":"Tax enhancements","category":"api","title":["Adds support for tax collection in Sri Lanka for digital services"]},{"id":"2026-02-12-add-sri-lanka-tax-id","slug":"sri-lanka-tax-id","products":["tax"],"breaking":false,"groupId":"tax","description":"Adds support for Sri Lanka VAT numbers (`lk_vat`) as a valid tax ID type. You can now use `lk_vat` when creating [customers](/api/customers/create?api-version=2026-02-25.clover#create_customer-tax_id_data-type), [tax IDs](/api/tax_ids/create?api-version=2026-02-25.clover#create_tax_id-type), [Checkout Sessions](/api/checkout/sessions/object?api-version=2026-02-25.clover#checkout_session_object-customer_details-tax_ids-type), [invoices](/api/invoices/create?api-version=2026-02-25.clover#create_invoice-customer_details-tax_ids), [tax calculations](/api/tax/calculations/create?api-version=2026-02-25.clover#calculate_tax-customer_details-tax_ids-type), and [tax transactions](/api/tax/transactions/object?api-version=2026-02-25.clover#tax_transaction_object-customer_details-tax_ids-type).","impact":"You can now collect and validate Sri Lanka VAT numbers from customers in your tax compliance workflows. This enables more accurate tax calculations and reporting for businesses operating in or with customers from Sri Lanka.","release":"2026-02-25.clover","train":"clover","changed":["lk_vat"],"affected":["Checkout.Session.customer_details.tax_ids[]","Invoice.customer_tax_ids[]","Tax.Calculation.customer_details.tax_ids[]","Tax.Transaction.customer_details.tax_ids[]","TaxId","Customer#create.tax_id_data[]","Invoice#create_preview.customer_details.tax_ids[]","Tax.Calculation#create.customer_details.tax_ids[]","TaxId#create","CustomerCreateParams.tax_id_data[]","CustomerCreateTaxIdParams","InvoiceCreatePreviewParams.customer_details.tax_ids[]","Tax.CalculationCreateParams.customer_details.tax_ids[]","TaxIdCreateParams","tax.CalculationCreateParams.customer_details.tax_ids[]","CheckoutSessionCustomerDetailsTaxIds","TaxCalculationCustomerDetailsTaxId","TaxTransactionCustomerDetailsTaxId","Checkout.Session.CustomerDetail.TaxId","Invoice.CustomerTaxId","Tax.Calculation.CustomerDetail.TaxId","Tax.Transaction.CustomerDetail.TaxId","CustomerCreateParamsTaxIdDatum","InvoiceCreatePreviewParamsCustomerDetailTaxId","tax.CalculationCreateParamsCustomerDetailTaxId"],"group":"Tax enhancements","category":"api","title":["Adds support for Sri Lanka VAT numbers"]},{"id":"2026-02-13-adds-events-for-resources-in-the-reserves-api","slug":"reserve-holds-releases-plans-events","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds support for receiving real-time notifications about changes to [Reserve Holds](/api/reserve/hold?api-version=2026-02-25.clover), [Reserve Releases](/api/reserve/release?api-version=2026-02-25.clover), and [Reserve Plans](/api/reserve/plan?api-version=2026-02-25.clover) associated with reserved funds on accounts.  - [reserve.hold.created](/api/events/types?api-version=2026-02-25.clover#event_types-reserve.hold.created): occurs when a `ReserveHold` is created. - [reserve.hold.updated](/api/events/types?api-version=2026-02-25.clover#event_types-reserve.hold.updated): occurs when a `ReserveHold` is updated. - [reserve.release.created](/api/events/types?api-version=2026-02-25.clover#event_types-reserve.release.created): occurs when a `ReserveRelease` is created. - [reserve.plan.created](/api/events/types?api-version=2026-02-25.clover#event_types-reserve.plan.created): occurs when a `ReservePlan` is created. - [reserve.plan.updated](/api/events/types?api-version=2026-02-25.clover#event_types-reserve.plan.updated): occurs when a `ReservePlan` is updated. - [reserve.plan.expired](/api/events/types?api-version=2026-02-25.clover#event_types-reserve.plan.expired): occurs when a `ReservePlan` expires. - [reserve.plan.disabled](/api/events/types?api-version=2026-02-25.clover#event_types-reserve.plan.disabled): occurs when a `ReservePlan` is disabled.","impact":"You can use these new events to programmatically monitor holds, releases, and plan configurations associated with reserved funds on accounts.","release":"2026-02-25.clover","train":"clover","changed":["reserve.hold.created","reserve.hold.updated","reserve.plan.created","reserve.plan.disabled","reserve.plan.expired","reserve.plan.updated","reserve.release.created","ReserveHoldCreatedEvent","ReserveHoldUpdatedEvent","ReservePlanCreatedEvent","ReservePlanDisabledEvent","ReservePlanExpiredEvent","ReservePlanUpdatedEvent","ReserveReleaseCreatedEvent","EventTypeReserveHoldCreated","EventTypeReserveHoldUpdated","EventTypeReservePlanCreated","EventTypeReservePlanDisabled","EventTypeReservePlanExpired","EventTypeReservePlanUpdated","EventTypeReserveReleaseCreated","RESERVE_HOLD_CREATED","RESERVE_HOLD_UPDATED","RESERVE_PLAN_CREATED","RESERVE_PLAN_DISABLED","RESERVE_PLAN_EXPIRED","RESERVE_PLAN_UPDATED","RESERVE_RELEASE_CREATED","ReserveHoldCreated","ReserveHoldUpdated","ReservePlanCreated","ReservePlanDisabled","ReservePlanExpired","ReservePlanUpdated","ReserveReleaseCreated"],"affected":["Reserve.Hold","Reserve.Plan","Reserve.Release","Event","WebhookEndpoint#update","WebhookEndpoint#create","WebhookEndpointUpdateParams","WebhookEndpointCreateParams","reserve.Hold","reserve.Plan","reserve.Release","ReserveHold","ReservePlan","ReserveRelease","Reserve::Hold","Reserve::Plan","Reserve::Release","WebhookEndpointModifyParams"],"group":"Payments and payment method enhancements","category":"api","title":["Adds events for reserve holds, releases, and plans"]},{"id":"2026-02-13-adds-file-purposes-for-terminal-wifi-certificates-and-private-keys","slug":"terminal-wifi-certificates-and-private-keys","products":["terminal"],"breaking":false,"groupId":"terminal","description":"Adds two new [file purposes](/api/files/create?api-version=2026-02-25.clover#create_file-purpose) for EAP-TLS Wi-Fi authentication: `terminal_wifi_certificate` and `terminal_wifi_private_key`.  You can use these file purposes to upload Wi-Fi certificate files and private key files through the [Files](/api/files?api-version=2026-02-25.clover) API. Both file purposes accept PEM format and are designed for use with the [Terminal Configuration](/api/terminal/configuration?api-version=2026-02-25.clover) API to [remotely configure Wi-Fi networks](/terminal/fleet/wifi) for Terminal readers.","impact":"You can now upload Wi-Fi certificate files to support WPA and WPA2 Enterprise (EAP-TLS) certificate-based authentication on Terminal readers.","release":"2026-02-25.clover","train":"clover","changed":["terminal_wifi_certificate","terminal_wifi_private_key"],"affected":["File#list","File","File#create","FileListParams","FileCreateParams"],"group":"Terminal enhancements","category":"api","title":["Adds support for uploading Terminal Wi-Fi certificates and private keys"]},{"id":"2026-02-15-adds-transaction-purpose-field-to-payment-intents-for-us-bank-account-payments","slug":"us-bank-account-payments-transaction-purpose","products":["payments"],"breaking":false,"groupId":"payments","description":"Adds the [transaction_purpose](/api/payment_intents/object?api-version=2026-02-25.clover#payment_intent_object-payment_method_options-us_bank_account-transaction_purpose) parameter to the [payment_method_options.us_bank_account](/api/payment_intents/object?api-version=2026-02-25.clover#payment_intent_object-payment_method_options-us_bank_account) hash in the [PaymentIntents](/api/payment_intents?api-version=2026-02-25.clover) API. This optional parameter allows you to specify the purpose of ACH debit transactions as `goods`, `services`, `other`, or `unspecified`. The parameter defaults to `unspecified` when not provided.","impact":"You can now specify a transaction purpose for US bank account payments when creating or updating PaymentIntents. While this parameter is optional, providing accurate transaction purpose information helps ensure compliance with ACH network requirements, including Nacha regulations that require certain ACH debit transactions to be explicitly identified as e-commerce purchases. You might not need to specify a transaction purpose to ensure compliance\u2014learn more about [ACH Direct Debit](/payments/ach-direct-debit).  If you process ACH debit payments for goods or services, consider updating your integration to include the appropriate `transaction_purpose` value when creating PaymentIntents.","release":"2026-02-25.clover","train":"clover","changed":["transaction_purpose","transactionPurpose","TransactionPurpose"],"affected":["PaymentIntent#confirm.payment_method_options.us_bank_account","PaymentIntent#create.payment_method_options.us_bank_account","PaymentIntent#update.payment_method_options.us_bank_account","PaymentIntent.payment_method_options.us_bank_account","PaymentIntentConfirmParams.payment_method_options.us_bank_account","PaymentIntentCreateParams.payment_method_options.us_bank_account","PaymentIntentUpdateParams.payment_method_options.us_bank_account","PaymentIntentConfirmPaymentMethodOptionsUsBankAccountParams","PaymentIntentPaymentMethodOptionsUsBankAccount","PaymentIntentPaymentMethodOptionsUsBankAccountParams","PaymentIntent.confirm().$params.payment_method_option.us_bank_account","PaymentIntent.create().$params.payment_method_option.us_bank_account","PaymentIntent.update().$params.payment_method_option.us_bank_account","PaymentIntent::PaymentMethodOption::UsBankAccount","PaymentIntentConfirmParams::PaymentMethodOption::UsBankAccount","PaymentIntentCreateParams::PaymentMethodOption::UsBankAccount","PaymentIntentUpdateParams::PaymentMethodOption::UsBankAccount","PaymentIntent.PaymentMethodOption.UsBankAccount","PaymentIntentConfirmParamsPaymentMethodOptionUsBankAccount","PaymentIntentCreateParamsPaymentMethodOptionUsBankAccount","PaymentIntentModifyParamsPaymentMethodOptionUsBankAccount","PaymentIntent.PaymentMethodOptions.UsBankAccount","PaymentIntentPaymentMethodOptionsUsBankAccountOptions"],"group":"Payments and payment method enhancements","category":"api","title":["Adds transaction purpose to PaymentIntents for US bank account payments"]},{"id":"2026-02-16-makes-tax-id-optional-for-boleto-payments","slug":"makes-tax-id-field-nullable-in-boleto-payment-method-details","products":[],"breaking":false,"groupId":"payments","description":"Updates the [payment_method_details.boleto.tax_id](/api/payment-record/object?api-version=2026-02-25.clover#payment_record_object-payment_method_details-boleto-tax_id) field to be nullable on the [Payment Record](/api/payment-record?api-version=2026-02-25.clover) and [Payment Attempt Record](/api/payment-attempt-record?api-version=2026-02-25.clover) objects. Previously, this field always returned a string value. You can still provide the tax ID when recording Boleto payments, but it\u2019s no longer required.","impact":"If your integration reads the `tax_id` from `payment_method_details.boleto` on Payment Record or Payment Attempt Record objects, it can now return `null`. Update any code that assumes this field is always present to handle a null value.","release":"2026-02-25.clover","train":"clover","changed":["PaymentAttemptRecord.payment_method_details.boleto.tax_id","PaymentRecord.payment_method_details.boleto.tax_id","PaymentAttemptRecord::PaymentMethodDetail::Boleto.tax_id","PaymentRecord::PaymentMethodDetail::Boleto.tax_id","PaymentAttemptRecord.PaymentMethodDetail.Boleto.tax_id","PaymentRecord.PaymentMethodDetail.Boleto.tax_id"],"affected":["string \u2192 nullable(string)","string \u2192 string | null"],"group":"Payments and payment method enhancements","category":"api","title":["Makes Boleto tax ID nullable in payment method details for Payment Records"]},{"id":"2026-02-23-stripe-s710-device-type","slug":"stripe-reader-s710","products":["terminal"],"breaking":false,"groupId":"terminal","description":"Adds support for the new [Stripe Reader S710](/terminal/readers/stripe-reader-s700-s710) Terminal device. `stripe_s710` and `simulated_stripe_s710` are now supported values for the [device_type](/api/terminal/readers/object?api-version=2026-02-25.clover#terminal_reader_object-device_type) property on the [Terminal Reader](/api/terminal/readers/object?api-version=2026-02-25.clover) object.  Additionally, adds a new [stripe_s710](/api/terminal/configuration/object?api-version=2026-02-25.clover#terminal_configuration_object-stripe_s710) hash that includes a [splashscreen](/api/terminal/configuration/object?api-version=2026-02-25.clover#terminal_configuration_object-stripe_s710-splashscreen) parameter. You can use this parameter to configure the splash screen display for S710 devices when you [create](/api/terminal/configuration/create?api-version=2026-02-25.clover) or [update](/api/terminal/configuration/update?api-version=2026-02-25.clover) Terminal Configurations.","impact":"You can now integrate Stripe Reader S710 devices into your payment processing workflow. If you're using Terminal Configurations to customize device behavior, you can configure splash screen settings specifically for S710 devices using the new `stripe_s710.splashscreen` parameter.","release":"2026-02-25.clover","train":"clover","changed":["cellular","stripe_s710","simulated_stripe_s710","stripeS710","Cellular","StripeS710"],"affected":["Terminal.Configuration","Terminal.Configuration#create","Terminal.Configuration#update","Terminal.Reader#list","Terminal.Reader","Terminal.ConfigurationCreateParams","Terminal.ConfigurationUpdateParams","Terminal.ReaderListParams","terminal.Configuration","terminal.ConfigurationCreateParams","terminal.ConfigurationUpdateParams","terminal.ReaderListParams","TerminalConfiguration","TerminalConfigurationParams","TerminalReader","Terminal\\Configuration.create().$params","Terminal\\Configuration.update().$params","Terminal::Configuration","Terminal::ConfigurationCreateParams","Terminal::ConfigurationUpdateParams","terminal.ConfigurationModifyParams","Terminal.ConfigurationCreateOptions","Terminal.ConfigurationUpdateOptions"],"group":"Terminal enhancements","category":"api","title":["Adds support for the Stripe Reader S710"]}]},{"published":"2026-02-25","title":"2026-02-25.preview","isHistorical":false,"channel":"preview","groups":[{"id":"connect","title":"Connect enhancements"},{"id":"payouts","title":"Payouts enhancements"}],"entries":[{"id":"2026-02-09-makes-transaction-flow-nullable","slug":"transaction-flow-nullable","products":["treasury"],"breaking":true,"description":"The [flow](/api/v2/money-management/transactions/object?api-version=2026-02-25.preview#v2_transaction_object-flow) property on the [Transaction](/api/v2/money-management/transactions/object?api-version=2026-02-25.preview) object is now nullable, returning null when there isn't another API object that represents the money movement. For API versions prior to [2026-02-25.preview](/changelog?channel=preview#2026-02-25.preview), `flow.type` is set to `other` in this scenario.  Existing money movements, such as [Outbound Payments](/api/v2/money-management/outbound-payments?api-version=2026-02-25.preview), will continue to populate `flow`.","breakingDescription":"Previously, the `flow` property always had a value. Making it nullable might cause errors if your integration doesn't properly handle null values.","impact":"If your integration relies on the `flow` property always having a value, update your code to handle null values. The property returns `null` in cases where there isn't another API object that represents the money movement.","release":"2026-02-25.preview","train":"clover","changed":["V2.MoneyManagement.Transaction.flow","V2.MoneyManagement.TransactionEntry.transaction_details.flow","V2::MoneyManagement::Transaction.flow","V2::MoneyManagement::TransactionEntry::TransactionDetail.flow","V2.MoneyManagement.TransactionEntry.TransactionDetail.flow"],"affected":["required \u2192 optional"],"category":"api","title":["Make the flow property nullable on Transactions"]},{"id":"2026-02-09-managed-payments-public-preview","slug":"managed-payments","products":["payments"],"breaking":false,"description":"Adds the ability to enable [Managed Payments](/payments/managed-payments), Stripe's merchant of record solution, by setting the [managed_payments](/api/checkout/sessions/create?api-version=2026-02-25.preview#create_checkout_session-managed_payments) parameter when creating a [Checkout Session](/api/checkout/sessions/create?api-version=2026-02-25.preview). To enable Managed Payments, you must accept the [Terms of Service](https://dashboard.stripe.com/settings/managed-payments).","impact":"Managed Payments allows you to sell your digital products globally while Stripe takes on the responsibility for indirect tax compliance (such as sales taxes, VAT, GST), fraud prevention, customer transaction support, and order management.","release":"2026-02-25.preview","train":"clover","changed":["managed_payments","managedPayments","ManagedPayments"],"affected":["Checkout.Session","Checkout.Session#create","PaymentIntent","SetupIntent","Subscription","Checkout.SessionCreateParams","checkout.Session","checkout.SessionCreateParams","CheckoutSession","CheckoutSessionParams","Checkout\\Session.create().$params","Checkout::Session","Checkout::SessionCreateParams","Checkout.SessionCreateOptions"],"category":"api","title":["Introduces Managed Payments, Stripe\u2019s merchant of record solution"]},{"id":"2026-02-11-adds-swiftcode-and-branchnumber-properties-to-payoutmethod-bank-account-responses","slug":"payout-method-bank-account-identification","products":[],"breaking":false,"groupId":"payouts","description":"Adds the [swift_code](/api/v2/money-management/payout-methods/object?api-version=2026-02-25.preview#v2_payout_method_object-bank_account-swift_code) and [branch_number](/api/v2/money-management/payout-methods/object?api-version=2026-02-25.preview#v2_payout_method_object-bank_account-branch_number) properties to the `bank_account` hash on the [Payout Method](/api/v2/money-management/payout-methods?api-version=2026-02-25.preview) object. Both properties return null when the information isn't available or doesn't apply to the bank account.","impact":"You can now access additional bank account identification details when retrieving Payout Methods. The `swift_code` property contains the bank\u2019s SWIFT or BIC code, and the `branch_number` property contains the branch identifier.","release":"2026-02-25.preview","train":"clover","changed":["branch_number","swift_code","branchNumber","swiftCode","BranchNumber","SwiftCode"],"affected":["V2.MoneyManagement.PayoutMethod.bank_account","v2.moneymanagement.PayoutMethod.bank_account","V2MoneyManagementPayoutMethodBankAccount","V2::MoneyManagement::PayoutMethod::BankAccount","V2.MoneyManagement.PayoutMethod.BankAccount"],"group":"Payouts enhancements","category":"api","title":["Expands bank account identification details in payout method responses"]},{"id":"2026-02-11-gb-cbp-country-expansion","slug":"cross-border-payouts-new-countries","products":["payments"],"breaking":false,"groupId":"payouts","description":"There are now 12 additional countries where your recipients can create bank accounts and receive payouts for cross-border payouts using [Global Payouts](/global-payouts) and [Accounts v2](/api/v2/core/accounts/object?api-version=2026-02-25.preview). The read-only [default_outbound_destination](/api/v2/core/accounts/object?api-version=2026-02-25.preview#v2_account_object-configuration-recipient-default_outbound_destination-type) enum on the [Accounts v2](/api/v2/core/accounts/object?api-version=2026-02-25.preview) object can now also be populated with the following destinations:  - `bt_bank_account`: Bhutan - `cr_bank_account`: Costa Rica - `do_bank_account`: Dominican Republic - `gt_bank_account`: Guatemala - `md_bank_account`: Moldova - `mk_bank_account`: North Macedonia - `mo_bank_account`: Macao - `mz_bank_account`: Mozambique - `pe_bank_account`: Peru - `pk_bank_account`: Pakistan - `tw_bank_account`: Taiwan - `uz_bank_account`: Uzbekistan","impact":"Recipients in these 12 countries can now create bank accounts and receive cross-border payouts using Global Payouts. You can use [Outbound Setup Intents](/api/v2/money-management/outbound-setup-intents?api-version=2026-02-25.preview) to create bank accounts and receive payouts from [Outbound Payments](/api/v2/money-management/outbound-payments?api-version=2026-02-25.preview). These bank accounts can also serve as the default outbound destination on the recipient accounts.","release":"2026-02-25.preview","train":"clover","changed":["bt_bank_account","cr_bank_account","do_bank_account","gt_bank_account","md_bank_account","mk_bank_account","mo_bank_account","mz_bank_account","pe_bank_account","pk_bank_account","tw_bank_account","uz_bank_account"],"affected":["V2.Core.Account.configuration.recipient.default_outbound_destination","V2CoreAccountConfigurationRecipientDefaultOutboundDestination","V2.Core.Account.Configuration.Recipient.DefaultOutboundDestination"],"group":"Payouts enhancements","category":"api","title":["Expands cross-border payout destinations to 12 additional countries"]},{"id":"2026-02-13-adds-smart-disputes-settings-to-the-accounts-api","slug":"smart-disputes-v2-accounts","products":["connect"],"breaking":false,"groupId":"connect","description":"Adds the [smart_disputes](/api/v2/core/accounts?api-version=2026-02-25.preview#v2_account_object-configuration-merchant-smart_disputes) hash to the [configuration.merchant](/api/v2/core/accounts/object?api-version=2026-02-25.preview#v2_account_object-configuration-merchant) field on the [v2 Account](/api/v2/core/accounts/object?api-version=2026-02-25.preview) object. The `smart_disputes` hash contains an [auto_respond](/api/v2/core/accounts/object?api-version=2026-02-25.preview#v2_account_object-configuration-merchant-smart_disputes-auto_respond) configuration that lets platforms control whether connected accounts automatically respond to disputes using [Smart Disputes](/disputes/smart-disputes).  The `auto_respond` configuration includes two fields: - [preference](/api/v2/core/accounts/object?api-version=2026-02-25.preview#v2_account_object-configuration-merchant-smart_disputes-auto_respond-preference): A writable parameter that accepts `on`, `off`, or `inherit` values to control the Smart Disputes setting. When you set `preference` to `inherit`, the connected account uses your platform's default Smart Disputes configuration. - [value](/api/v2/core/accounts/object?api-version=2026-02-25.preview#v2_account_object-configuration-merchant-smart_disputes-auto_respond-value): A read-only property that shows the effective setting value as either `on` or `off`.  You can update these settings when you [create](/api/v2/core/accounts/create?api-version=2026-02-25.preview) or [update](/api/v2/core/accounts/update?api-version=2026-02-25.preview) an account.","impact":"You can now configure Smart Disputes behavior for your connected accounts programmatically. Previously, connected accounts could only manage Smart Disputes settings through their Dashboard access.  This change gives you programmatic control over how disputes are handled for individual connected accounts while maintaining the flexibility to let accounts inherit your platform's default configuration.","release":"2026-02-25.preview","train":"clover","changed":["smart_disputes","smartDisputes","SmartDisputes"],"affected":["V2.Core.Account#create.configuration.merchant","V2.Core.Account#update.configuration.merchant","V2.Core.Account.configuration.merchant","V2.Core.AccountCreateParams.configuration.merchant","V2.Core.AccountUpdateParams.configuration.merchant","v2.core.Account.configuration.merchant","v2.core.AccountCreateParams.configuration.merchant","v2.core.AccountUpdateParams.configuration.merchant","V2CoreAccountConfigurationMerchant","V2CoreAccountConfigurationMerchantParams","V2\\Core\\Account.create().$params.configuration.merchant","V2\\Core\\Account.update().$params.configuration.merchant","V2::Core::Account::Configuration::Merchant","V2::Core::AccountCreateParams::Configuration::Merchant","V2::Core::AccountUpdateParams::Configuration::Merchant","V2.Core.Account.Configuration.Merchant","v2.core.AccountCreateParamsConfigurationMerchant","v2.core.AccountModifyParamsConfigurationMerchant","V2CoreAccountConfigurationMerchantOptions"],"group":"Connect enhancements","category":"api","title":["Adds Smart Disputes settings to v2 Accounts"]},{"id":"2026-02-19-adds-purpose-parameter-to-outbound-payment-for-payroll-designation","slug":"outbound-payments-purpose","products":["payouts"],"breaking":false,"groupId":"payouts","description":"Adds the [purpose](/api/v2/money-management/outbound-payments/object?api-version=2026-02-25.preview#v2_outbound_payment_object-purpose) parameter to the [v2 Outbound Payment](/api/v2/money-management/outbound-payments/object?api-version=2026-02-25.preview) object. This optional parameter allows you to specify the purpose of an outbound payment.","impact":"You can now specify a payment purpose when [creating](/api/v2/money-management/outbound-payments/create?api-version=2026-02-25.preview) a v2 Outbound Payment. If you process US ACH payments intended for payroll, you can set `purpose` to `payroll` to help ensure compliance with upcoming NACHA requirements.","release":"2026-02-25.preview","train":"clover","changed":["purpose","Purpose"],"affected":["V2.MoneyManagement.OutboundPayment","V2.MoneyManagement.OutboundPayment#create","V2.MoneyManagement.OutboundPaymentCreateParams","v2.moneymanagement.OutboundPayment","v2.moneymanagement.OutboundPaymentCreateParams","V2MoneyManagementOutboundPayment","V2MoneyManagementOutboundPaymentParams","V2\\MoneyManagement\\OutboundPayment.create().$params","V2::MoneyManagement::OutboundPayment","V2::MoneyManagement::OutboundPaymentCreateParams","v2.money_management.OutboundPaymentCreateParams","V2.MoneyManagement.OutboundPaymentCreateOptions"],"group":"Payouts enhancements","category":"api","title":["Adds the ability to specify the purpose of Outbound Payments"]}]}]}]}}]}}};
