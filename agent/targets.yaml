# Watch targets. Format is fixed by specs/agent.md §`agent/targets.yaml` format.
#
# The orchestrator reads this, spawns one watcher subagent per vendor, and maps a
# ChangeEvent to the code it can break via `files`. Adding a vendor means adding a block
# here AND an extraction block in skills/brightdata-changelog-scraper/SKILL.md.

repo: Kush614/upstream-watch

vendors:
  stripe:
    url: https://docs.stripe.com/changelog
    schema: schemas/changelog-entry.json
    # Substring-matched against entry title/body and against the vendor's own
    # `changed`/`affected` symbol lists. See specs/scraper-pipeline.md §3.
    symbols: [charges.create, payment_intents, Charge#create, PaymentIntent#create]
    files: [demo-app/src/payments.ts]

  # A second vendor is cut #1 in docs/PLAN.md. Do not add one until the loop is green.
